name = "test"
summary = "Test suite"
description = "Test suite for CLAM, this webservice doesn't do anything actually useful. It just provides a testing bed for various CLAM features."
authors = [ "Maarten van Gompel" ]
affiliation = "CLST, Radboud University"
termsofservice = "Use and adapt this example as you please"
rootdir = "./data"
version = "0.1"

[auth]
postauth_url = "/index"

[license]
name = "GNU Affero General Public License"
id = "AGPL-3.0-only"
url = "https://www.gnu.org/licenses/agpl-3.0.en.html"

[contact]
name = "Maarten van Gompel"
url = "https://proycon.anaproy.nl"
email = "proycon@anaproy.nl"


[[filetypes]]
id = "plaintext"
name = "Plain Text (UTF-8)"
contenttype = "text/plain; charset=utf-8"

[[endpoints]]
name = "porch"
path = "/"
mode = "LandingPage"

#Index of endpoints and projects
[[endpoints]]
name = "index"
path = "/index"
mode = "Index"

#---------------------------------------------------------------------------------

[[endpoints]]
name = "Uppercase (project)"
description = "Endpoint to uppercase a text (batch processing, file based)"
path = "/"  #project name will be appended automatically
mode = "Project"
status_pattern = ".*" #every line from stderr qualifies as a status message
command = "./testwrapper.sh"

[[endpoints.args]]
parameter_id = "inputtxt"

[[endpoints.parameters]]
id = "inputtxt"
name = "Input text"
description = "Input text file"
required = true
type = { parametertype = "File", filetype = "plaintext", filename = { nametype = "Pattern", value = "\\.txt$" } }
multipe = true

[[endpoints.outputfiles]]
name = "Output text"
type = "plaintext"
filename = { nametype = "Pattern", value = "\\.txt$" }

#---------------------------------------------------------------------------------

[[endpoints]]
name = "Uppercase (action)"
description = "Endpoint to uppercase a text (single round-trip action, string-based)"
path = "/uppercase"  #project name will be appended automatically
mode = "Action"
command = "./testwrapper.sh"
filetype = "plaintext"

[[endpoints.args]]
parameter_id = "text"

[[endpoints.parameters]]
id = "text"
name = "Text"
description = "Input text to turn to uppercase"
required = true
type = { parametertype = "String" }
flag = "-t"

[[endpoints]]
name = "Parameter test"
description = "Endpoint for parameter tests"
path = "/paramtest"
mode = "Action"
command = "./paramtest.sh"
filetype = "plaintext"

[[endpoints.parameters]]
id = "bool"
name = "Boolean test"
description = "Boolean test parameter"
required = false
type = { parametertype = "Bool", default = false }
flag = "-b"

[[endpoints.parameters]]
id = "int"
name = "Integer test"
description = "Integer between 1 and 10"
required = false
type = { parametertype = "Int", min = 1, max= 10  }
flag = "-i"

[[endpoints.parameters]]
id = "float"
name = "Float test"
description = "Float test parameter with default"
required = false
type = { parametertype = "Float", default = 3.14  }
flag = "-f"

[[endpoints.parameters]]
id = "string"
name = "String test"
description = "String test parameter"
required = false
type = { parametertype = "String"  }
flag = "-s"
