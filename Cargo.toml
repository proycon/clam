[package]
name = "clam"
version = "0.4.0"
edition = "2024"
authors = ["Maarten van Gompel <proycon@anaproy.nl>"]
description = "Quickly build RESTful webservices and user interfaces around your command-line tools"
include = ["src/**/*","tests/**/*", "LICENSE", "README.md"]
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/proycon/clam"
keywords = [ "webservice", "rest"]

[dependencies]
axum = "0.8.8"
base64 = "0.22.1"
clap = { version = "4.5.60", features = ["derive"] }
const_format = "0.2.36"
derive-getters = { version = "0.5.0", features = ["auto_copy_getters"] }
md5 = "0.8.0"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.0", features = ["signal", "macros", "rt-multi-thread"] }
toml = "1.1.2"
tower-http = { version = "0.6.8", features = ["trace", "normalize-path"] }
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
