[service]
name = "freqlist"
summary = "This webservice produces a frequency list for an input file"
description = "You can upload a plain text file, and the tokens in it will be analysed and their frequency outputted in a TSV file"
rootdir = "./data"

[service.auth]
postauth_url = "/index"

[service.license]
name = "GNU Affero General Public License"
id = "AGPL-3.0-only"
url = "https://www.gnu.org/licenses/agpl-3.0.en.html"

[service.contact]
name = "Maarten van Gompel"
url = "https://proycon.anaproy.nl"
email = "proycon@anaproy.nl"


[[service.filetypes]]
id = "plaintext"
name = "Plain Text (UTF-8)"
contenttype = "text/plain; charset=utf-8"

[[service.filetypes]]
id = "tsv"
name = "Tab Separated Values (UTF-8)"
contenttype = "text/tsv"

[[service.endpoints]]
path = "/"
mode = "Porch"

#Index of endpoints and projects
[[service.endpoints]]
path = "/index"
mode = "Index"

[[service.endpoints]]
path = "/"  #project name will be appended automatically
mode = "Project"
status_pattern = ".*" #every line from stderr qualifies as a status message
command = "freqlist.sh"

[[service.endpoints.args]]
parameter_id = "casesensitive"

[[service.endpoints.args]]
parameter_id = "tokinput"

[[service.endpoints.parameters]]
id = "tokinput"
description = "Tokenised text input"
required = true
type = { parametertype = "File", filetype = "plaintext", filename = { nametype = "Pattern", value = "*.txt" } }

[[service.endpoints.parameters]]
id = "casesensitive"
description = "Case sensitivity"
required = false
type = { parametertype = "Boolean", default = false, flag = "-c"  }

[[service.outputfiles]]
name = "Frequency list"
type = "tsv"
filename = { nametype = "Pattern", value = "*.txt" }
